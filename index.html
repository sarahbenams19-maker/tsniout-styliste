<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tsnioût & Style</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f0a0a;min-height:100vh;font-family:Georgia,serif;color:#f5e6d3;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}
.card{background:#1a0f0f;border:1px solid rgba(201,149,106,0.2);border-radius:12px;overflow:hidden;}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#2a1515;}
.card-info{padding:10px;}
.card-name{font-size:12px;color:#f5e6d3;margin-bottom:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-price{font-size:14px;color:#c9956a;font-weight:600;margin-bottom:8px;}
.card-btn{display:block;width:100%;padding:8px;background:linear-gradient(135deg,#c9956a,#a07040);border:none;border-radius:8px;color:#fff;font-size:11px;cursor:pointer;text-align:center;text-decoration:none;font-family:Georgia,serif;}
.search-bar{display:flex;gap:10px;padding:16px;max-width:600px;margin:0 auto;}
.search-input{flex:1;padding:14px 18px;background:rgba(255,255,255,0.05);border:1px solid rgba(201,149,106,0.3);border-radius:12px;color:#f5e6d3;font-size:15px;font-family:Georgia,serif;outline:none;}
.search-input::placeholder{color:#5a4030;}
.search-btn{padding:14px 24px;background:linear-gradient(135deg,#c9956a,#a07040);border:none;border-radius:12px;color:#fff;font-size:14px;cursor:pointer;font-family:Georgia,serif;}
.tag{display:inline-block;padding:6px 14px;background:rgba(201,149,106,0.1);border:1px solid rgba(201,149,106,0.25);border-radius:20px;color:#c9956a;font-size:12px;cursor:pointer;margin:4px;}
.loading{text-align:center;padding:60px;color:#c9956a;font-size:14px;}
.empty{text-align:center;padding:40px;color:#7a6050;font-size:14px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const RAPIDAPI_KEY = "a6b28af1ebmsh650165ce4116d0fp11c73bjsn42c3f57b3eba";

const SUGGESTIONS = [
  "modest dress","long black skirt","maxi skirt",
  "long sleeve top","midi dress","modest blouse",
  "wide leg trousers","long cardigan","pleated midi skirt"
];

function getImg(p) {
  let img = p.imageUrl || p.image || "";
  if (!img && p.images) img = Array.isArray(p.images) ? (p.images[0]?.url || p.images[0] || "") : "";
  if (img && !img.startsWith("http")) img = "https://" + img;
  return img;
}

function getUrl(p) {
  const slug = p.url || "";
  if (slug.startsWith("http")) return slug;
  if (slug) return "https://www.asos.com" + (slug.startsWith("/") ? "" : "/") + slug;
  if (p.id) return `https://www.asos.com/prd/${p.id}`;
  return "https://www.asos.com/";
}

function getPrice(p) {
  if (p.price?.current?.text) return p.price.current.text;
  if (p.price?.current?.value) return p.price.current.value + " $";
  if (typeof p.price === 'string') return p.price;
  return "";
}

function App(){
  const [query, setQuery] = useState("");
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(false);
  const [searched, setSearched] = useState(false);
  const [error, setError] = useState("");

  const search = async (q) => {
    const term = q || query;
    if(!term.trim()) return;
    setLoading(true);
    setSearched(true);
    setError("");
    setProducts([]);
    try {
      const url = `https://asos10.p.rapidapi.com/api/v1/getProductListBySearchTerm?searchTerm=${encodeURIComponent(term)}&currency=USD&country=US&store=US&languageShort=en&sizeSchema=US&limit=20&offset=0&sort=recommended`;
      const res = await fetch(url, {
        method: "GET",
        headers: {
          "x-rapidapi-host": "asos10.p.rapidapi.com",
          "x-rapidapi-key": RAPIDAPI_KEY
        }
      });
      const data = await res.json();
      const items = data?.data?.products || [];
      if(items.length === 0) setError("Aucun produit trouvé pour \"" + term + "\"");
      else setProducts(items);
    } catch(e) {
      setError("Erreur: " + e.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{minHeight:"100vh"}}>
      <div style={{textAlign:"center",padding:"40px 16px 20px"}}>
        <div style={{fontSize:11,letterSpacing:"0.3em",color:"#c9956a",marginBottom:8,textTransform:"uppercase"}}>✦ Mode Pudique ✦</div>
        <h1 style={{fontSize:"clamp(1.6rem,6vw,2.8rem)",fontWeight:400,background:"linear-gradient(135deg,#f5e6d3,#c9956a,#f5e6d3)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:6}}>
          Tsnioût & Style
        </h1>
        <p style={{color:"#7a6050",fontSize:13}}>Découvre les vraies pièces • Tendance • Pudique</p>
      </div>

      <div className="search-bar">
        <input className="search-input" type="text" placeholder="Ex: modest dress, maxi skirt..."
          value={query} onChange={e=>setQuery(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&search()}/>
        <button className="search-btn" onClick={()=>search()}>Rechercher</button>
      </div>

      {!searched && (
        <div style={{textAlign:"center",padding:"8px 16px 24px"}}>
          <p style={{color:"#5a4030",fontSize:12,marginBottom:10}}>Suggestions :</p>
          {SUGGESTIONS.map(s=>(
            <span key={s} className="tag" onClick={()=>{setQuery(s);search(s);}}>{s}</span>
          ))}
        </div>
      )}

      {loading && <div className="loading"><div style={{fontSize:30,marginBottom:12}}>✦</div><p>Recherche en cours...</p></div>}
      {error && !loading && <div className="empty"><p>{error}</p></div>}

      {!loading && products.length > 0 && (
        <>
          <div style={{padding:"0 16px 8px",color:"#7a6050",fontSize:12,textAlign:"center"}}>
            {products.length} produits pour "{query}"
          </div>
          <div className="grid">
            {products.map((p,i)=>{
              const img=getImg(p);
              const url=getUrl(p);
              const price=getPrice(p);
              const name=p.name||p.title||"Produit";
              return(
                <div key={i} className="card">
                  {img
                    ? <img src={img} alt={name} loading="lazy" onError={e=>e.target.style.display="none"}/>
                    : <div style={{width:"100%",aspectRatio:"3/4",background:"#2a1515"}}/>
                  }
                  <div className="card-info">
                    <div className="card-name">{name}</div>
                    {price&&<div className="card-price">{price}</div>}
                    <a href={url} target="_blank" rel="noopener noreferrer" className="card-btn">Voir sur ASOS →</a>
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
