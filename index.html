<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tsnioût & Style</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:linear-gradient(135deg,#1a0a0a 0%,#2d1515 40%,#1a0a1a 100%);min-height:100vh;font-family:Georgia,serif;color:#f5e6d3;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const LINKS = {
  zara:"https://www.zara.com/fr/",mango:"https://shop.mango.com/fr/",
  asos:"https://www.asos.com/fr/",laredoute:"https://www.laredoute.fr/",
  modanisa:"https://www.modanisa.com/fr/",shein:"https://www.shein.com/fr/",
  hm:"https://www2.hm.com/fr_fr/",cos:"https://www.cos.com/fr_fr/",
  stories:"https://www.stories.com/fr_fr/"
};

function getLink(m){
  if(!m)return LINKS.asos;
  const s=m.toLowerCase();
  if(s.includes("zara"))return LINKS.zara;
  if(s.includes("mango"))return LINKS.mango;
  if(s.includes("asos"))return LINKS.asos;
  if(s.includes("redoute"))return LINKS.laredoute;
  if(s.includes("modanisa"))return LINKS.modanisa;
  if(s.includes("shein"))return LINKS.shein;
  if(s.includes("h&m")||s.includes("h&m"))return LINKS.hm;
  if(s.includes("cos"))return LINKS.cos;
  if(s.includes("stories"))return LINKS.stories;
  return LINKS.asos;
}

const gold="#c9956a",dark="#1a0a0a";

const card={background:"rgba(255,255,255,0.03)",border:"1px solid rgba(201,149,106,0.2)",borderRadius:20,padding:"28px 24px",width:"100%",maxWidth:540};
const btnPrimary={flex:1,padding:"13px",background:"linear-gradient(135deg,#c9956a,#a07040)",border:"none",borderRadius:12,color:"#fff",fontSize:14,fontFamily:"Georgia,serif",cursor:"pointer"};
const btnOff={flex:1,padding:"13px",background:"rgba(201,149,106,0.1)",border:"none",borderRadius:12,color:"#5a4030",fontSize:14,fontFamily:"Georgia,serif",cursor:"not-allowed"};
const btnBack={padding:"13px 18px",background:"transparent",border:"1px solid rgba(201,149,106,0.3)",borderRadius:12,color:"#7a6050",fontSize:14,fontFamily:"Georgia,serif",cursor:"pointer"};
const btnOutline={width:"100%",padding:"13px",background:"transparent",border:"1px solid rgba(201,149,106,0.4)",borderRadius:12,color:gold,fontSize:14,fontFamily:"Georgia,serif",cursor:"pointer",marginTop:10};

function App(){
  const [step,setStep]=useState(0);
  const [form,setForm]=useState({niveau:"",occasion:"",style:"",saison:"",budget:"moyen"});
  const [result,setResult]=useState(null);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");

  const pick=(k,v)=>setForm(f=>({...f,[k]:v}));

  const generate=async()=>{
    setLoading(true);setError("");setResult(null);
    const niv=form.niveau==="orthodoxe"?"Orthodoxe : coudes, genoux, cou couverts en permanence":"Traditionnel : longueurs midi, bras couverts";
    const bud=form.budget==="petit"?"moins de 50€":form.budget==="moyen"?"50 à 150€":"150€ et plus";
    const prompt=`Tu es une styliste experte en mode tsniout pour femmes juives pratiquantes.
Profil : niveau ${niv}, occasion ${form.occasion}, style ${form.style}, saison ${form.saison}, budget ${bud}.
Marques autorisées UNIQUEMENT : Zara, Mango, Asos, La Redoute, Modanisa, Shein, H&M, COS, & Other Stories
Réponds UNIQUEMENT en JSON valide sans backticks ni markdown :
{"titre":"...","description":"...","pieces":[{"type":"...","description":"...","marque":"...","prix_estime":"...","pourquoi_tsniout":"..."}],"conseil_styliste":"...","palette":["#hex1","#hex2","#hex3"]}`;
    try{
  const res = await fetch("/api/chat",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({prompt})
});
const data=await res.json();
const text=data.text||"";

      const match=text.match(/\{[\s\S]*\}/);
      if(!match)throw new Error("Format inattendu");
      setResult(JSON.parse(match[0]));setStep(6);
    }catch(e){setError("Erreur : "+e.message);}
    finally{setLoading(false);}
  };

  const reset=()=>{setStep(0);setForm({niveau:"",occasion:"",style:"",saison:"",budget:"moyen"});setResult(null);setError("");};

  const OCard=({label,desc,sel,onClick})=>(
    <div onClick={onClick} style={{padding:"16px 18px",border:`1px solid ${sel?"#c9956a":"rgba(201,149,106,0.2)"}`,borderRadius:14,cursor:"pointer",background:sel?"rgba(201,149,106,0.12)":"transparent",marginBottom:10}}>
      <div style={{color:sel?"#f5e6d3":gold,fontWeight:500,fontSize:15,marginBottom:3}}>{label}</div>
      {desc&&<div style={{color:"#7a6050",fontSize:13}}>{desc}</div>}
    </div>
  );

  const GCard=({emoji,label,sel,onClick})=>(
    <div onClick={onClick} style={{padding:"16px 12px",border:`1px solid ${sel?"#c9956a":"rgba(201,149,106,0.2)"}`,borderRadius:14,cursor:"pointer",background:sel?"rgba(201,149,106,0.12)":"transparent",textAlign:"center"}}>
      <div style={{fontSize:22,marginBottom:6}}>{emoji}</div>
      <div style={{color:sel?"#f5e6d3":"#a07860",fontSize:12,lineHeight:1.4}}>{label}</div>
    </div>
  );

  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"0 16px 60px"}}>
      <div style={{textAlign:"center",padding:"48px 0 28px",width:"100%",maxWidth:540}}>
        <div style={{fontSize:12,letterSpacing:"0.3em",color:gold,marginBottom:10,textTransform:"uppercase"}}>✦ Styliste Personnelle ✦</div>
        <h1 style={{fontSize:"clamp(1.8rem,7vw,3rem)",fontWeight:400,background:"linear-gradient(135deg,#f5e6d3,#c9956a,#f5e6d3)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Tsnioût & Style</h1>
        <p style={{color:"#a07860",fontSize:14,marginTop:10}}>Mode pudique • Tendance • Authentique</p>
      </div>

      {step<6&&!loading&&(
        <div style={{display:"flex",gap:8,marginBottom:28}}>
          {[0,1,2,3,4].map(i=><div key={i} style={{width:i===step?28:8,height:8,borderRadius:4,background:i<step?"#c9956a":i===step?"#e8b080":"rgba(201,149,106,0.2)",transition:"all 0.4s"}}/>)}
        </div>
      )}

      {step===0&&(
        <div style={card}>
          <h2 style={{fontSize:"1.2rem",fontWeight:400,color:"#f5e6d3",marginBottom:6}}>Mon niveau de pratique</h2>
          <p style={{color:"#7a6050",fontSize:13,marginBottom:20}}>Pour des suggestions parfaitement adaptées</p>
          <OCard label="Orthodoxe" desc="Tsniout stricte — coudes, genoux, col couverts" sel={form.niveau==="orthodoxe"} onClick={()=>pick("niveau","orthodoxe")}/>
          <OCard label="Traditionnel" desc="Pudeur modérée — longueurs midi, bras couverts" sel={form.niveau==="traditionnel"} onClick={()=>pick("niveau","traditionnel")}/>
          <button style={form.niveau?btnPrimary:btnOff} disabled={!form.niveau} onClick={()=>setStep(1)}>Suivant →</button>
        </div>
      )}

      {step===1&&(
        <div style={card}>
          <h2 style={{fontSize:"1.2rem",fontWeight:400,color:"#f5e6d3",marginBottom:6}}>L'occasion</h2>
          <p style={{color:"#7a6050",fontSize:13,marginBottom:20}}>Pour quand créons-nous cette tenue ?</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[["🕯️","Shabbat"],["✨","Fêtes religieuses"],["☀️","Quotidien"],["💼","Travail"],["💫","Soirée / Mariage"],["🌿","Sport / Détente"]].map(([e,l])=>(
              <GCard key={l} emoji={e} label={l} sel={form.occasion===l} onClick={()=>pick("occasion",l)}/>
            ))}
          </div>
          <div style={{display:"flex",gap:10,marginTop:16}}>
            <button style={btnBack} onClick={()=>setStep(0)}>←</button>
            <button style={form.occasion?btnPrimary:btnOff} disabled={!form.occasion} onClick={()=>setStep(2)}>Suivant →</button>
          </div>
        </div>
      )}

      {step===2&&(
        <div style={card}>
          <h2 style={{fontSize:"1.2rem",fontWeight:400,color:"#f5e6d3",marginBottom:6}}>Mon style</h2>
          <p style={{color:"#7a6050",fontSize:13,marginBottom:20}}>Quelle est ton esthétique ?</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[["🖤","Chic & Élégant"],["✌️","Casual & Moderne"],["🌸","Romantique"],["⬜","Minimaliste"]].map(([e,l])=>(
              <GCard key={l} emoji={e} label={l} sel={form.style===l} onClick={()=>pick("style",l)}/>
            ))}
          </div>
          <div style={{display:"flex",gap:10,marginTop:16}}>
            <button style={btnBack} onClick={()=>setStep(1)}>←</button>
            <button style={form.style?btnPrimary:btnOff} disabled={!form.style} onClick={()=>setStep(3)}>Suivant →</button>
          </div>
        </div>
      )}

      {step===3&&(
        <div style={card}>
          <h2 style={{fontSize:"1.2rem",fontWeight:400,color:"#f5e6d3",marginBottom:6}}>La saison</h2>
          <p style={{color:"#7a6050",fontSize:13,marginBottom:20}}>Pour des matières et couleurs adaptées</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[["🌷","Printemps"],["☀️","Été"],["🍂","Automne"],["❄️","Hiver"]].map(([e,l])=>(
              <GCard key={l} emoji={e} label={l} sel={form.saison===l} onClick={()=>pick("saison",l)}/>
            ))}
          </div>
          <div style={{display:"flex",gap:10,marginTop:16}}>
            <button style={btnBack} onClick={()=>setStep(2)}>←</button>
            <button style={form.saison?btnPrimary:btnOff} disabled={!form.saison} onClick={()=>setStep(4)}>Suivant →</button>
          </div>
        </div>
      )}

      {step===4&&(
        <div style={card}>
          <h2 style={{fontSize:"1.2rem",fontWeight:400,color:"#f5e6d3",marginBottom:6}}>Mon budget</h2>
          <p style={{color:"#7a6050",fontSize:13,marginBottom:20}}>Pour des pièces vraiment accessibles</p>
          <OCard label="Petit budget" desc="Moins de 50€ la tenue complète" sel={form.budget==="petit"} onClick={()=>pick("budget","petit")}/>
          <OCard label="Budget moyen" desc="Entre 50€ et 150€" sel={form.budget==="moyen"} onClick={()=>pick("budget","moyen")}/>
          <OCard label="Budget confortable" desc="150€ et plus" sel={form.budget==="confortable"} onClick={()=>pick("budget","confortable")}/>
          <div style={{display:"flex",gap:10,marginTop:8}}>
            <button style={btnBack} onClick={()=>setStep(3)}>←</button>
            <button style={btnPrimary} onClick={generate}>✨ Créer ma tenue</button>
          </div>
        </div>
      )}

      {loading&&(
        <div style={{...card,textAlign:"center",padding:"48px 24px"}}>
          <div style={{fontSize:36,marginBottom:16}}>✦</div>
          <p style={{color:gold,fontSize:14}}>Ta styliste compose ta tenue…</p>
        </div>
      )}

      {error&&!loading&&(
        <div style={{...card,textAlign:"center"}}>
          <div style={{fontSize:32,marginBottom:12}}>⚠️</div>
          <p style={{color:gold,marginBottom:20,fontSize:14}}>{error}</p>
          <button style={btnPrimary} onClick={generate}>🔄 Réessayer</button>
          <button style={btnOutline} onClick={()=>setStep(4)}>← Modifier mes choix</button>
        </div>
      )}

      {step===6&&result&&!loading&&(
        <div style={{width:"100%",maxWidth:540}}>
          <div style={{background:"rgba(201,149,106,0.08)",border:"1px solid rgba(201,149,106,0.3)",borderRadius:20,padding:"28px 24px",marginBottom:14,textAlign:"center"}}>
            {result.palette?.length>0&&(
              <div style={{display:"flex",justifyContent:"center",gap:10,marginBottom:14}}>
                {result.palette.map((c,i)=><div key={i} style={{width:22,height:22,borderRadius:"50%",background:c}}/>)}
              </div>
            )}
            <h2 style={{fontSize:"1.4rem",fontWeight:400,color:"#f5e6d3",marginBottom:10}}>{result.titre}</h2>
            <p style={{color:"#a07860",fontSize:14,lineHeight:1.6}}>{result.description}</p>
          </div>

          {result.pieces?.map((p,i)=>(
            <div key={i} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(201,149,106,0.2)",borderRadius:16,padding:"18px 20px",marginBottom:12}}>
              <div style={{fontSize:11,color:gold,textTransform:"uppercase",letterSpacing:"0.15em",marginBottom:6}}>{p.type}</div>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                <p style={{margin:0,color:"#f5e6d3",fontSize:14,lineHeight:1.5,flex:1}}>{p.description}</p>
                <span style={{color:gold,fontWeight:600,marginLeft:12,whiteSpace:"nowrap"}}>{p.prix_estime}</span>
              </div>
              <div style={{fontSize:12,color:"#7a6050",marginBottom:12,fontStyle:"italic"}}>✓ {p.pourquoi_tsniout}</div>
              <a href={getLink(p.marque)} target="_blank" style={{display:"inline-block",padding:"7px 16px",background:"rgba(201,149,106,0.15)",border:"1px solid rgba(201,149,106,0.4)",borderRadius:8,color:gold,fontSize:12,textDecoration:"none"}}>
                Voir sur {p.marque} →
              </a>
            </div>
          ))}

          {result.conseil_styliste&&(
            <div style={{background:"rgba(201,149,106,0.06)",border:"1px solid rgba(201,149,106,0.2)",borderRadius:16,padding:"18px 20px",marginBottom:16}}>
              <div style={{fontSize:11,color:gold,textTransform:"uppercase",letterSpacing:"0.15em",marginBottom:8}}>✦ Conseil de ta styliste</div>
              <p style={{color:"#d4b896",fontSize:14,lineHeight:1.6,fontStyle:"italic"}}>"{result.conseil_styliste}"</p>
            </div>
          )}

          <button style={{...btnPrimary,width:"100%"}} onClick={generate}>🔄 Générer une autre tenue</button>
          <button style={btnOutline} onClick={reset}>↺ Recommencer depuis le début</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
