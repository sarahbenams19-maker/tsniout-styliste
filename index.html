<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tsnioût & Style</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f0a0a;min-height:100vh;font-family:Georgia,serif;color:#f5e6d3;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}
.card{background:#1a0f0f;border:1px solid rgba(201,149,106,0.2);border-radius:12px;overflow:hidden;transition:transform 0.2s;}
.card:hover{transform:translateY(-3px);}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;}
.card-info{padding:10px;}
.card-name{font-size:12px;color:#f5e6d3;margin-bottom:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-price{font-size:14px;color:#c9956a;font-weight:600;margin-bottom:8px;}
.card-btn{display:block;width:100%;padding:8px;background:linear-gradient(135deg,#c9956a,#a07040);border:none;border-radius:8px;color:#fff;font-size:11px;cursor:pointer;text-align:center;text-decoration:none;font-family:Georgia,serif;}
.search-bar{display:flex;gap:10px;padding:16px;max-width:600px;margin:0 auto;}
.search-input{flex:1;padding:14px 18px;background:rgba(255,255,255,0.05);border:1px solid rgba(201,149,106,0.3);border-radius:12px;color:#f5e6d3;font-size:15px;font-family:Georgia,serif;outline:none;}
.search-input::placeholder{color:#5a4030;}
.search-btn{padding:14px 24px;background:linear-gradient(135deg,#c9956a,#a07040);border:none;border-radius:12px;color:#fff;font-size:14px;cursor:pointer;font-family:Georgia,serif;white-space:nowrap;}
.tag{display:inline-block;padding:6px 14px;background:rgba(201,149,106,0.1);border:1px solid rgba(201,149,106,0.25);border-radius:20px;color:#c9956a;font-size:12px;cursor:pointer;margin:4px;}
.tag:hover{background:rgba(201,149,106,0.2);}
.loading{text-align:center;padding:60px;color:#c9956a;font-size:14px;}
.empty{text-align:center;padding:60px;color:#7a6050;font-size:14px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const SUGGESTIONS = [
  "long black skirt","midi dress","long sleeve top",
  "modest dress","maxi skirt","pleated midi skirt",
  "blazer women","wide leg trousers","wedding guest dress",
  "long sleeve blouse","flowy maxi dress","autumn dress"
];

function extractProducts(data) {
  if (!data) return [];
  // Essayer toutes les structures possibles
  if (Array.isArray(data)) return data;
  if (data.products && Array.isArray(data.products)) return data.products;
  if (data.data && Array.isArray(data.data)) return data.data;
  if (data.data && data.data.products) return data.data.products;
  if (data.results && Array.isArray(data.results)) return data.results;
  if (data.items && Array.isArray(data.items)) return data.items;
  // Chercher récursivement le premier tableau
  for (const key of Object.keys(data)) {
    if (Array.isArray(data[key]) && data[key].length > 0) return data[key];
  }
  return [];
}

function getProductInfo(p) {
  const name = p.name || p.title || "";
  const price = p.price?.current?.text || 
                (p.price?.current?.value ? p.price.current.value + "€" : "") ||
                p.priceLabel || "";
  const imgBase = p.imageUrl || p.images?.[0]?.url || "";
  const img = imgBase ? (imgBase.startsWith("http") ? imgBase : "https://" + imgBase) : "";
  const productId = p.id || "";
  const url = productId 
    ? `https://www.asos.com/fr/${p.url || "product/" + productId}`
    : `https://www.asos.com/fr/search/?q=${encodeURIComponent(name)}`;
  return { name, price, img, url };
}


function App(){
  const [query, setQuery] = useState("");
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(false);
  const [searched, setSearched] = useState(false);
  const [error, setError] = useState("");
  const [debugMsg, setDebugMsg] = useState("");

  const search = async (q) => {
    const term = q || query;
    if(!term.trim()) return;
    setLoading(true);
    setSearched(true);
    setError("");
    setProducts([]);
    setDebugMsg("");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({query: term})
      });
      const json = await res.json();
      setDebugMsg(json.debug || "");
      const items = extractProducts(json.data || json);
      if(items.length === 0) {
        setError("Aucun produit trouvé. Essaie en anglais (ex: long black skirt)");
      } else {
        setProducts(items);
      }
    } catch(e) {
      setError("Erreur: " + e.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{minHeight:"100vh"}}>
      <div style={{textAlign:"center",padding:"40px 16px 20px"}}>
        <div style={{fontSize:11,letterSpacing:"0.3em",color:"#c9956a",marginBottom:8,textTransform:"uppercase"}}>✦ Mode Pudique ✦</div>
        <h1 style={{fontSize:"clamp(1.6rem,6vw,2.8rem)",fontWeight:400,background:"linear-gradient(135deg,#f5e6d3,#c9956a,#f5e6d3)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:6}}>
          Tsnioût & Style
        </h1>
        <p style={{color:"#7a6050",fontSize:13}}>Découvre les vraies pièces • Tendance • Pudique</p>
      </div>

      <div className="search-bar">
        <input
          className="search-input"
          type="text"
          placeholder="Ex: long black skirt, midi dress..."
          value={query}
          onChange={e => setQuery(e.target.value)}
          onKeyDown={e => e.key==="Enter" && search()}
        />
        <button className="search-btn" onClick={() => search()}>Rechercher</button>
      </div>

      {!searched && (
        <div style={{textAlign:"center",padding:"8px 16px 24px"}}>
          <p style={{color:"#5a4030",fontSize:12,marginBottom:10}}>Suggestions :</p>
          <div>
            {SUGGESTIONS.map(s => (
              <span key={s} className="tag" onClick={() => { setQuery(s); search(s); }}>{s}</span>
            ))}
          </div>
        </div>
      )}

      {loading && (
        <div className="loading">
          <div style={{fontSize:30,marginBottom:12}}>✦</div>
          <p>Recherche en cours...</p>
        </div>
      )}

      {error && !loading && (
        <div className="empty">
          <div style={{fontSize:30,marginBottom:12}}>🔍</div>
          <p>{error}</p>
          {debugMsg && <p style={{fontSize:10,color:"#3a2020",marginTop:8,wordBreak:"break-all"}}>{debugMsg}</p>}
        </div>
      )}

      {!loading && products.length > 0 && (
        <>
          <div style={{padding:"0 16px 8px",color:"#7a6050",fontSize:12,textAlign:"center"}}>
            {products.length} produits pour "{query}"
          </div>
          <div className="grid">
            {products.map((p, i) => {
              const {name, price, img, url} = getProductInfo(p);
              return (
                <div key={i} className="card">
                  {img && <img src={img} alt={name} loading="lazy" onError={e => e.target.style.display="none"}/>}
                  <div className="card-info">
                    <div className="card-name">{name}</div>
                    {price && <div className="card-price">{price}</div>}
                    <a href={url} target="_blank" rel="noopener noreferrer" className="card-btn">
                      Voir sur ASOS →
                    </a>
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
